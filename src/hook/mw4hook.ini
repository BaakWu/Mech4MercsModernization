; mw4hook configuration
;
; The Windowed setting itself lives in options.ini:
;   [graphics options] windowed=true|false   (Options > Video > Windowed)
; The window/screen size is the selected resolution
;   [graphics options] screenwidth / screenheight (Options > Video > Resolution)
;
; window.enabled    - size, frame and center the main window in windowed mode
; window.relaunch   - relaunch once if -window does not match the setting
; display.enabled   - run the frontend at the selected resolution, honor the
;                     Windowed setting at runtime, never fall back to 16-bit
; display.checkbox  - add the Windowed checkbox to Options > Video
; frontend.stretch  - scale the 800x600 shell to the window (4:3 kept)
; log.enabled       - write mw4hook-<pid>.log next to the game executable
[window]
enabled=1
relaunch=1

[display]
enabled=1
checkbox=1

[frontend]
stretch=1

[log]
enabled=1
