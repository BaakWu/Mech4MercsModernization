; mw4hook configuration
;
; The Windowed setting itself lives in options.ini:
;   [graphics options] windowed=true|false   (Options > Video > Windowed)
; The window/screen size is the selected resolution
;   [graphics options] screenwidth / screenheight (Options > Video > Resolution)
;
; window.enabled    - window layout: framed (Windowed on) or borderless
;                     fullscreen (Windowed off); Alt+Enter toggles
; window.relaunch   - relaunch once if -window is missing
; display.enabled   - missions at the selected resolution, 32-bit only, never
;                     exclusive fullscreen
; display.checkbox  - add the Windowed checkbox to Options > Video
; frontend.stretch  - scale the picture to the window (aspect kept)
; controls.mw5      - MechWarrior 5-style driving (off by default): W/S move
;                     the throttle twice as fast, a reverse throttle eases
;                     back to 0 when no throttle key is held, X = full stop
; log.enabled       - write mw4hook-<pid>.log next to the game executable
[window]
enabled=1
relaunch=1

[display]
enabled=1
checkbox=1

[frontend]
stretch=1

[controls]
mw5=0

[log]
enabled=1
