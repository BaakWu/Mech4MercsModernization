; mw4hook configuration
;
; Launch the game with -window. The hook forces the client area to the size
; below and rewrites the game's built-in 800x600 display default.
;
; window.enabled      - force the Win32 client area to width x height
; resolution.enabled  - patch the game's built-in display default (800x600)
; log.enabled         - write mw4hook-<pid>.log next to the game executable
[window]
enabled=1
relaunch=1
width=1024
height=768

[resolution]
enabled=1
width=1024
height=768

[log]
enabled=1
