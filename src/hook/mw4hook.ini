; mw4hook configuration
;
; The Windowed setting itself lives in options.ini:
;   [graphics options] windowed=true|false   (Options > Video > Windowed)
; The window/screen size is the selected resolution
;   [graphics options] screenwidth / screenheight (Options > Video > Resolution)
;
; window.enabled    - window layout: framed (Windowed on) or borderless
;                     fullscreen (Windowed off); Alt+Enter toggles
; window.relaunch   - relaunch once if -window is missing
; display.enabled   - missions at the selected resolution, 32-bit only, never
;                     exclusive fullscreen
; display.checkbox  - add the Windowed checkbox to Options > Video
; frontend.stretch  - scale the picture to the window (aspect kept)
; frontend.filter   - how the 800x600 menus are scaled up: lanczos (sharper
;                     text and edges, default) or halftone (Windows' softer
;                     stretch, as before 1.4)
; frontend.badge    - a "MODERNIZED / PATCH vX.Y.Z" badge in the empty plate at
;                     the bottom left of the Main Menu
; controls.mw5      - MechWarrior 5-style controls (off by default): W/S move
;                     the throttle twice as fast; the DEFAULT button in
;                     Options > Controls loads the MW5 key layout
; controls.decay    - Throttle Decay (Options > Game, saved here): with W/S
;                     released the throttle eases back to 0; presets hold
; aim.track_pointer - mouse aim point, part of the installer's MechWarrior
;                     5-style controls option (off by default): the mouse
;                     moves an aim point and the torso turns to it at its
;                     own speed and stops on it (no catch-up drift; a fast
;                     flick lands where a slow one does). Needs the mouse on
;                     and Options > Controls > Mouse X Axis = Torso.
; aim.sensitivity   - aim point speed, multiplier on the game's mouse
;                     sensitivity slider (1.0 = about 160 degrees of twist
;                     for 3 inches at 800 dpi with the default slider)
; aim.marker        - with track_pointer: a small circle marks the aim point
;                     (always shown; the torso turns until the reticle is on it)
; aim.gyro          - Gyro Aim (Options > Game, saved here; needs
;                     track_pointer): the aim keeps its direction while the
;                     legs turn, until the torso reaches its twist limit
; aim.auto_center   - with track_pointer: 0 (default) = aiming never turns the
;                     'Mech; the game's automatic centering (options.ini
;                     autotorsocenter) is off while the aim point is in use.
;                     1 = keep it (the legs turn toward the torso after a
;                     delay). Center Legs To Torso / Center Torso To Legs
;                     work either way.
; mechlab.default_camo - camouflage for a new pilot's 'Mechs (None = stock
;                     paint; or the first character of a MechLab camouflage
;                     name, e.g. a for "a-Snow - SnowBall"; empty = MekTek's
;                     "7-Ops - Pink"). Each pilot can change it later on
;                     Options > Multiplayer > Skin.
; hud.sharp         - the mission HUD's small white texts from sharper copies
;                     made when they load; the rest of the HUD is unchanged
; hud.names         - with sharp: the lance roster's 'Mech names are redrawn
;                     from the game's MicroStyle font at the screen
;                     resolution, as sharp as the pilot names
; mechlab.class_filter - a Class droplist (All / Light / Medium / Heavy /
;                     Assault / Elemental) on the MechLab's Chassis tab that
;                     narrows the chassis list to one weight class
; sound.background  - keep the game's audio playing when its window is not in
;                     the foreground (input still pauses)
; log.enabled       - write mw4hook-<pid>.log next to the game executable
[window]
enabled=1
relaunch=1

[display]
enabled=1
checkbox=1

[frontend]
stretch=1
filter=lanczos
badge=1

[controls]
mw5=0
decay=0

[aim]
track_pointer=0
sensitivity=1.0
marker=1
gyro=0
auto_center=0

[mechlab]
default_camo=None
class_filter=1

; campaign.full_company - installer option, experimental (issue #21):
;                     campaign missions that allow lancemates allow the full
;                     company of 7 (8 'Mechs with you; the Secondary Lance
;                     needs a lance commander). Solo missions stay solo.
[campaign]
full_company=0

[hud]
sharp=1
names=1

[sound]
background=1

[log]
enabled=1
